<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR Report</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: "Noto Sans Khmer", "Khmer OS", system-ui, sans-serif;
    margin: 0; padding: 24px; background: #f4f5f7; color: #1c1e21;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .meta { color: #65676b; font-size: 13px; margin-bottom: 20px; }
  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  }
  .card {
    margin: 0; background: #fff; border: 1px solid #dadde1; border-radius: 10px;
    padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); display: flex; flex-direction: column;
  }
  .crop {
    background: #fafafa; border: 1px solid #eee; border-radius: 6px;
    padding: 8px; text-align: center; min-height: 48px;
    display: flex; align-items: center; justify-content: center;
  }
  .crop img { max-width: 100%; height: auto; image-rendering: auto; }
  .missing { color: #b00020; font-size: 12px; }
  figcaption { margin-top: 10px; }
  .pred { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
  .pred + .pred { border-top: 1px dashed #eee; }
  .model {
    flex: 0 0 auto; font-size: 11px; color: #65676b; background: #eef0f3;
    border-radius: 4px; padding: 1px 6px; white-space: nowrap;
  }
  .text { font-size: 20px; line-height: 1.5; word-break: break-word; }
  .empty { color: #b0b3b8; font-style: italic; font-size: 14px; }
  .filename { margin-top: 8px; font-size: 11px; color: #90949c; word-break: break-all; }
</style>
</head>
<body>
  <h1>OCR Report</h1>
  <div class="meta">2 cropped image(s) — each crop shown with its predicted text below.</div>
  <div class="grid">
<figure class="card"><div class="crop"><div class="missing">image not found:<br>/home/thareah/Desktop/text_img/original/khmer_10k/test/images/0000001.jpg</div></div><figcaption><div class="pred"><span class="model">vgg_bilstm_ctc_10k</span><span class="text">ទី ១១ងេ)</span></div><div class="pred"><span class="model">vgg_bilstm_ctc_50k</span><span class="text">ទី ១១(ង)</span></div></figcaption><div class="filename">0000001.jpg</div></figure>
<figure class="card"><div class="crop"><div class="missing">image not found:<br>/home/thareah/Desktop/text_img/original/khmer_10k/test/images/0000002.jpg</div></div><figcaption><div class="pred"><span class="model">vgg_bilstm_ctc_10k</span><span class="text">ក)</span></div><div class="pred"><span class="model">vgg_bilstm_ctc_50k</span><span class="text">(ក ) –</span></div></figcaption><div class="filename">0000002.jpg</div></figure>
  </div>
</body>
</html>
